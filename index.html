<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="A clean, minimal online random quote generator.">
  <title>Quiet Quote — A little perspective</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f2;
      --ink: #20211f;
      --muted: #777970;
      --line: #e4e2da;
      --accent: #6f765e;
      --card: rgba(255,255,255,.62);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column;
    }
    header, footer {
      width: min(100% - 48px, 1080px); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    header { padding: 28px 0; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; letter-spacing: .02em; }
    .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; border: 1px solid #c9c9bd; border-radius: 50%; color: var(--accent); font-family: Georgia, serif; font-size: 19px; }
    .top-note { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    main { width: min(100% - 40px, 760px); margin: auto; padding: 68px 0 76px; flex: 1; display: flex; align-items: center; }
    .content { width: 100%; }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .16em; font-size: 11px; font-weight: 700; margin: 0 0 24px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(38px, 6vw, 66px); line-height: 1.04; letter-spacing: -.045em; margin: 0 0 14px; }
    .subhead { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 38px; }
    .quote-card { border: 1px solid var(--line); border-radius: 18px; background: var(--card); padding: clamp(26px, 5vw, 48px); min-height: 275px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 12px 36px rgba(31,32,27,.025); }
    .quote-mark { color: #b7b8a9; font-family: Georgia, serif; font-size: 54px; line-height: .7; margin-bottom: 18px; }
    blockquote { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(25px, 4vw, 38px); line-height: 1.35; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .author-row { display: flex; gap: 12px; align-items: center; margin-top: 27px; color: var(--muted); font-size: 14px; }
    .author-line { width: 26px; height: 1px; background: var(--accent); flex: 0 0 auto; }
    #author { color: var(--ink); font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 12px 18px; min-height: 46px; font: inherit; font-size: 13px; font-weight: 650; color: var(--ink); cursor: pointer; transition: background .18s ease, transform .18s ease, border-color .18s ease; }
    button:hover { background: #eeede6; border-color: #cfcec4; }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .primary { background: var(--ink); color: #fff; border-color: var(--ink); padding-inline: 22px; }
    .primary:hover { background: #3a3b36; border-color: #3a3b36; }
    .btn-icon { font-size: 16px; margin-right: 7px; vertical-align: -1px; }
    .status { min-height: 22px; margin: 14px 2px 0; font-size: 12px; color: var(--muted); }
    .status.error { color: #9a463e; }
    .source-note { font-size: 11px; line-height: 1.6; color: #8a8b83; margin-top: 12px; }
    footer { border-top: 1px solid var(--line); padding: 22px 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    footer a { color: inherit; text-underline-offset: 3px; }
    .loading blockquote { opacity: .45; }
    @media (max-width: 540px) {
      header, footer { width: calc(100% - 32px); }
      main { width: calc(100% - 32px); padding: 52px 0; }
      .top-note { font-size: 10px; }
      .quote-card { min-height: 250px; }
      footer { align-items: flex-start; gap: 10px; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">q</span><span>QUIET QUOTE</span></div>
    <div class="top-note">A little perspective</div>
  </header>

  <main>
    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow">A moment to reflect</p>
      <h1 id="page-title">Words worth<br>pausing for.</h1>
      <p class="subhead">A fresh thought, whenever you need one.</p>

      <article class="quote-card" id="quote-card" aria-live="polite" aria-busy="false">
        <div class="quote-mark" aria-hidden="true">“</div>
        <blockquote id="quote">Your next bit of perspective is one click away.</blockquote>
        <div class="author-row"><span class="author-line"></span><span id="author">Quiet Quote</span></div>
      </article>

      <div class="actions">
        <button class="primary" id="new-quote" type="button"><span class="btn-icon" aria-hidden="true">↻</span>New quote</button>
        <button id="copy-quote" type="button"><span class="btn-icon" aria-hidden="true">▢</span>Copy quote</button>
      </div>
      <p class="status" id="status" role="status">Connecting to the quote service…</p>
      <p class="source-note"></p>
    </section>
  </main>

  <footer>
    <span>Made for a quieter moment.</span>
    <span>Online quotes · No account required</span>
  </footer>

  <script>
    (() => {
      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');
      const statusEl = document.getElementById('status');
      const card = document.getElementById('quote-card');
      const newBtn = document.getElementById('new-quote');
      const copyBtn = document.getElementById('copy-quote');

      // Primary: DummyJSON's documented random quote endpoint.
      // Fallback: Dumb APIs' public-domain book excerpt endpoint.
      const endpoints = [
        async () => {
          const response = await fetch('https://dummyjson.com/quotes/random', { cache: 'no-store' });
          if (!response.ok) throw new Error('Primary quote service returned ' + response.status);
          const data = await response.json();
          if (!data.quote || !data.author) throw new Error('Unexpected response from primary quote service');
          return { quote: data.quote, author: data.author, source: 'DummyJSON' };
        },
        async () => {
          const response = await fetch('https://dumbapis.com/quote', { cache: 'no-store' });
          if (!response.ok) throw new Error('Backup quote service returned ' + response.status);
          const data = await response.json();
          if (!data.quote || !data.author) throw new Error('Unexpected response from backup quote service');
          return { quote: data.quote, author: data.author, source: 'Dumb APIs' };
        }
      ];

      let current = { quote: '', author: '' };
      let requestNumber = 0;

      async function loadQuote() {
        const thisRequest = ++requestNumber;
        newBtn.disabled = true;
        newBtn.innerHTML = '<span class="btn-icon" aria-hidden="true">↻</span>Loading…';
        card.classList.add('loading');
        card.setAttribute('aria-busy', 'true');
        statusEl.classList.remove('error');
        statusEl.textContent = 'Finding a fresh quote…';

        let lastError;
        for (const endpoint of endpoints) {
          try {
            const data = await endpoint();
            if (thisRequest !== requestNumber) return;
            current = data;
            quoteEl.textContent = data.quote;
            authorEl.textContent = data.author;
            statusEl.textContent = '';
            statusEl.classList.remove('error');
            card.classList.remove('loading');
            card.setAttribute('aria-busy', 'false');
            newBtn.disabled = false;
            newBtn.innerHTML = '<span class="btn-icon" aria-hidden="true">↻</span>New quote';
            return;
          } catch (error) {
            lastError = error;
          }
        }

        if (thisRequest !== requestNumber) return;
        statusEl.textContent = 'Could not reach the quote services. Check your internet connection and try again.';
        statusEl.classList.add('error');
        card.classList.remove('loading');
        card.setAttribute('aria-busy', 'false');
        newBtn.disabled = false;
        newBtn.innerHTML = '<span class="btn-icon" aria-hidden="true">↻</span>Try again';
        console.warn('Quote services unavailable:', lastError);
      }

      async function copyQuote() {
        if (!current.quote) {
          statusEl.textContent = 'Load a quote before copying.';
          return;
        }
        const text = '“' + current.quote + '” — ' + current.author;
        try {
          await navigator.clipboard.writeText(text);
          statusEl.classList.remove('error');
          statusEl.textContent = 'Quote copied to clipboard.';
        } catch {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          const ok = document.execCommand('copy');
          textarea.remove();
          statusEl.textContent = ok ? 'Quote copied to clipboard.' : 'Copy was blocked by your browser. Select the quote text to copy it.';
        }
      }

      newBtn.addEventListener('click', loadQuote);
      copyBtn.addEventListener('click', copyQuote);
      document.addEventListener('keydown', (event) => {
        if (event.altKey && event.key.toLowerCase() === 'n') loadQuote();
      });
      loadQuote();
    })();
  </script>
</body>
</html>
